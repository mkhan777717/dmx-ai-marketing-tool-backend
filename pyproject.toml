[project]
name = "ai-marketing-tool-backend"
version = "0.1.0"
description = "AI-Powered Digital Marketing Platform Backend"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi>=0.111.0,<0.112.0",
    "uvicorn[standard]>=0.30.1,<0.31.0",
    "sqlalchemy>=2.0.30,<3.0.0",
    "asyncpg>=0.29.0,<0.30.0",
    "celery==5.6.3",
    "aiosqlite>=0.20.0,<0.21.0",
    "psycopg2-binary>=2.9.12,<3.0.0",
    "alembic>=1.13.1,<2.0.0",
    "cryptography>=50.0.0,<51.0.0",
    "pydantic[email]>=2.7.4,<3.0.0",
    "pydantic-settings>=2.3.4,<3.0.0",
    "redis>=5.0.7,<6.0.0",
    "pyjwt>=2.8.0,<3.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "python-multipart>=0.0.9,<0.1.0",
]

[tool.poetry]
name = "ai-marketing-tool-backend"
version = "0.1.0"
description = "AI-Powered Digital Marketing Platform Backend"
authors = ["Admin <admin@example.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.1"}
sqlalchemy = "^2.0.30"
asyncpg = "^0.29.0"
celery = "5.6.3"
aiosqlite = "^0.20.0"
psycopg2-binary = "^2.9.12"
alembic = "^1.13.1"
pydantic = {extras = ["email"], version = "^2.7.4"}
pydantic-settings = "^2.3.4"
redis = "^5.0.7"
pyjwt = "^2.8.0"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
pytest-asyncio = "^0.23.7"
httpx = "^0.27.0"
ruff = "^0.4.9"
pre-commit = "^3.7.1"

black = "^25.1.0"
isort = "^6.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
addopts = "-v --asyncio-mode=auto"
testpaths = ["tests"]
pythonpath = ["."]


[tool.black]
line-length = 88
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 88
py_version = 313
